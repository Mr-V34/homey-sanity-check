<!doctype html>
<html>
<head>
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
</head>
<body>
  <header class="homey-header">
    <h1 class="homey-title" data-i18n="settings.title"></h1>
    <p class="homey-subtitle" data-i18n="settings.subtitle"></p>
  </header>

  <fieldset class="homey-form-fieldset">
    <legend class="homey-form-legend" data-i18n="settings.summary"></legend>
    <div class="homey-form-group">
      <label class="homey-form-label" for="summaryHour" data-i18n="settings.summary_hour"></label>
      <input class="homey-form-input" id="summaryHour" type="number" min="0" max="23" step="1">
    </div>
    <div class="homey-form-group">
      <label class="homey-form-label" for="summaryDetail" data-i18n="settings.summary_detail"></label>
      <select class="homey-form-select" id="summaryDetail">
        <option value="short"></option>
        <option value="full"></option>
      </select>
    </div>
    <div class="homey-form-group">
      <label class="homey-form-checkbox">
        <input class="homey-form-checkbox-input" id="reportBackup" type="checkbox">
        <span class="homey-form-checkbox-checkmark"></span>
        <span class="homey-form-checkbox-text" id="reportBackupText"></span>
      </label>
    </div>
  </fieldset>

  <button id="save" class="homey-button-primary-full" data-i18n="settings.save"></button>

  <script type="text/javascript">
    // Keep in sync with lib/constants.js
    const DEFAULT_SUMMARY_HOUR = 8;
    const SUMMARY_DETAILS = ['short', 'full'];

    function onHomeyReady(Homey) {
      const hourInput = document.getElementById('summaryHour');
      const detailInput = document.getElementById('summaryDetail');
      const backupInput = document.getElementById('reportBackup');
      // data-i18n is documented for headings only, so the options get their text here.
      for (const option of detailInput.options) option.textContent = Homey.__(`settings.detail_${option.value}`);
      document.getElementById('reportBackupText').textContent = Homey.__('settings.report_backup');

      Homey.get('summaryHour', (err, h) => {
        hourInput.value = Number.isInteger(h) ? h : DEFAULT_SUMMARY_HOUR;
        Homey.get('summaryDetail', (err2, d) => {
          detailInput.value = SUMMARY_DETAILS.includes(d) ? d : SUMMARY_DETAILS[0];
          Homey.get('reportBackup', (err3, b) => {
            backupInput.checked = b !== false; // on unless turned off
            Homey.ready();
          });
        });
      });

      document.getElementById('save').addEventListener('click', () => {
        const hour = Math.min(23, Math.max(0, parseInt(hourInput.value, 10) || 0));
        const detail = SUMMARY_DETAILS.includes(detailInput.value) ? detailInput.value : SUMMARY_DETAILS[0];
        Homey.set('summaryHour', hour, err => {
          if (err) return Homey.alert(err);
          Homey.set('summaryDetail', detail, err2 => {
            if (err2) return Homey.alert(err2);
            Homey.set('reportBackup', backupInput.checked, err3 => {
              if (err3) return Homey.alert(err3);
              Homey.alert(Homey.__('settings.saved'));
            });
          });
        });
      });
    }
  </script>
</body>
</html>
